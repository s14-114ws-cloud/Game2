# Netlify：ビルド不要。リポジトリ直下の index.html（1ファイル版）をそのまま公開する
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 開発用ツールは公開しない
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true
